<!DOCTYPE html>
<html lang="mg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sekoly Baiboly</title>

<style>
body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #0f172a;
    color: #f1f5f9;
}

header {
    background: #6366f1;
    padding: 16px;
    text-align: center;
}

main {
    max-width: 800px;
    margin: auto;
    padding: 16px;
}

.chapter {
    background: #1e293b;
    border-radius: 10px;
    margin-bottom: 12px;
}

.chapter-header {
    padding: 14px;
    font-weight: bold;
    cursor: pointer;
}

.chapter-content {
    display: none;
    padding: 14px;
    border-top: 1px solid #334155;
}
</style>
</head>

<body>

<header>
    <h1>Sekoly Baiboly</h1>
</header>

<main id="content">
    <p>Chargement...</p>
</main>

<script>
const chapters = [
  {
    "number": "I",
    "title": "JESOSY DIA NANDIDY MBA ATAO MPIANATRA",
    "sections": [
      { "title": "Ny Fampianarany", "content": "Koa mandehana ianareo..." }
    ]
  },
  {
    "number": "II",
    "title": "MANDRAY NY TENIN'ANDRIAMANITRA",
    "sections": [
      { "title": "Fo Tsara", "content": "Fa ireo teny amin'ny tany tsara..." }
    ]
  }
];

const content = document.getElementById("content");

function render() {
    content.innerHTML = "";
    chapters.forEach(c => {
        const div = document.createElement("div");
        div.className = "chapter";
        div.innerHTML = `
            <div class="chapter-header">${c.number}. ${c.title}</div>
            <div class="chapter-content">
                ${c.sections.map(s => `<p>${s.content}</p>`).join("")}
            </div>
        `;
        div.querySelector(".chapter-header").onclick = () => {
            const body = div.querySelector(".chapter-content");
            body.style.display = body.style.display === "block" ? "none" : "block";
        };
        content.appendChild(div);
    });
}

render();
</script>

</body>
</html>
